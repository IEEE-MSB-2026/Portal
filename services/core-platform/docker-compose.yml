services:
  core-db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ieee_core
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-platform:
    build: .
    depends_on:
      core-db:
        condition: service_healthy
    ports:
      - "5070:5070"
    environment:
      PORT: 5070
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://core:core@core-db:5432/core_platform
      CORE_GATEWAY_SHARED_SECRET: change-me-core-gateway-secret
    command: sh -c "npm run migrate && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
