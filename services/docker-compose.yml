version: '3.9'

networks:
  portal-network:
    driver: bridge

services:
  # ==========================================
  # EMAIL SERVICE
  # ==========================================
  email-redis:
    image: redis:7-alpine
    container_name: email-redis
    restart: unless-stopped
    networks:
      - portal-network
    volumes:
      - email_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  email-api:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: email-api
    restart: unless-stopped
    networks:
      - portal-network
    env_file:
      - ./email-service/.env
    environment:
      REDIS_HOST: email-redis
      PORT: 3060
      RUN_API: "true"
      RUN_CONSUMER: "false"
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN:-2nUcG0xRi652tH8Y1RW/lsA2+BOvli2RvbNSfeMwl1Q=}
    depends_on:
      email-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3060/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  email-consumer:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: email-consumer
    profiles: ["email-broker"]
    restart: unless-stopped
    networks:
      - portal-network
    env_file:
      - ./email-service/.env
    environment:
      REDIS_HOST: email-redis
      RUN_API: "false"
      RUN_CONSUMER: "true"
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN:-2nUcG0xRi652tH8Y1RW/lsA2+BOvli2RvbNSfeMwl1Q=}
    depends_on:
      email-redis:
        condition: service_healthy

  # ==========================================
  # CORE PLATFORM SERVICE
  # ==========================================
  core-postgres:
    image: postgres:15-alpine
    container_name: core-postgres
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      POSTGRES_DB: ieee_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - core_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ieee_core"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core-platform:
    build:
      context: ./core-platform
      dockerfile: Dockerfile
    container_name: core-app
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      NODE_ENV: production
      PORT: 5070
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgrespassword}@core-postgres:5432/ieee_core
      CORE_GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-secret-change-in-prod}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-secret-change-in-prod}
      EMAIL_SERVICE_URL: http://email-api:3060
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN:-2nUcG0xRi652tH8Y1RW/lsA2+BOvli2RvbNSfeMwl1Q=}
      IAM_SERVICE_URL: http://gateway:4000
      IAM_SERVICE_AUTH_TOKEN: ${IAM_SERVICE_AUTH_TOKEN:-b4K9jP1xL0wQ8rT7yU3iO5pE2aS6dF9gH1jK3lM5nO7=}
    depends_on:
      core-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5070/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # GATEWAY / IAM SERVICE (PUBLIC FACING)
  # ==========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    networks:
      - portal-network
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-key-production-2026}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-secret-change-in-prod}
      AUTH_CLAIMS_HMAC_SECRET: ${AUTH_CLAIMS_HMAC_SECRET:-integration-claims-secret}
      IAM_SERVICE_AUTH_TOKEN: ${IAM_SERVICE_AUTH_TOKEN:-b4K9jP1xL0wQ8rT7yU3iO5pE2aS6dF9gH1jK3lM5nO7=}
      CORE_PLATFORM_URL: http://core-platform:5070
      EVENT_REGISTER_URL: http://event-app:5050
      EMAIL_SERVICE_URL: http://email-api:3060
      FILE_SERVICE_URL: http://file-service:5080
    depends_on:
      core-platform:
        condition: service_healthy
      event-app:
        condition: service_healthy
      email-api:
        condition: service_healthy
      file-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # CLOUDINARY FILE SERVICE
  # ==========================================
  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: portal-file-service
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      PORT: 5080
      NODE_ENV: production
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-secret-change-in-prod}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_ROOT_FOLDER: ieee_portal
      MAX_IMAGE_SIZE_MB: 5
      MAX_DOC_SIZE_MB: 15
      MAX_VIDEO_SIZE_MB: 25
      ENABLE_LOCAL_FALLBACK: "false"
    volumes:
      - file_uploads:/tmp/ieee_uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # EVENT REGISTER SERVICE
  # ==========================================
  event-app:
    build:
      context: ./event-register
      dockerfile: Dockerfile
    container_name: event-register-app
    env_file:
      - ./event-register/.env
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGO_URI: mongodb://event-mongo:27017/ieee-registration
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-strong-password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-strong-password}@event-redis:6379
      REDIS_STREAM_EMAIL: internal
      EMAIL_SERVICE_URL: http://email-api:3060
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN:-2nUcG0xRi652tH8Y1RW/lsA2+BOvli2RvbNSfeMwl1Q=}
    depends_on:
      event-mongo:
        condition: service_healthy
      event-redis:
        condition: service_healthy
    volumes:
      - event_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5050/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  event-mongo:
    image: mongo:7
    container_name: event-register-mongo
    restart: unless-stopped
    networks:
      - portal-network
    volumes:
      - event_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  event-redis:
    image: redis:7-alpine
    container_name: event-register-redis
    restart: unless-stopped
    networks:
      - portal-network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-strong-password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-strong-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  email_redis_data:
  event_mongo_data:
  event_uploads:
  file_uploads:
  core_pg_data: