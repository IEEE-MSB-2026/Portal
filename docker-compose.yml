name: ieee-portal

networks:
  portal-network:
    driver: bridge

services:
  # ==============================================================================
  # SHARED CACHE & EVENT BROKER (REDIS 7)
  # DB 0: email-service queue & idempotency
  # DB 1: event-register caching & streams
  # ==============================================================================
  portal-redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    networks:
      - portal-network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - portal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  # ==============================================================================
  # CORE PLATFORM DATABASE (POSTGRESQL 16)
  # ==============================================================================
  core-postgres:
    image: postgres:16-alpine
    container_name: core-postgres
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ieee_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - core_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ieee_core}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ==============================================================================
  # EVENT REGISTRATION DATABASE (MONGODB 7)
  # ==============================================================================
  event-mongo:
    image: mongo:7
    container_name: event-mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    profiles: ["mongo"]
    networks:
      - portal-network
    volumes:
      - event_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  # ==============================================================================
  # CORE PLATFORM MICROSERVICE (PORT 5070)
  # ==============================================================================
  core-platform:
    build:
      context: ./services/core-platform
      dockerfile: Dockerfile
    container_name: core-app
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      PORT: 5070
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@core-postgres:5432/${POSTGRES_DB:-ieee_core}
      CORE_GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      EMAIL_SERVICE_URL: http://email-api:3060
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN}
      EMAIL_SERVICE_TIMEOUT_MS: ${EMAIL_SERVICE_TIMEOUT_MS:-15000}
      IAM_SERVICE_URL: http://gateway:4000
      IAM_SERVICE_AUTH_TOKEN: ${IAM_SERVICE_AUTH_TOKEN}
      EVENT_REGISTER_SERVICE_URL: http://event-app:5050
      HR_ACCEPT_GOVERNANCE_MODE: mode_b
      PR_CAMPAIGN_MAX_RECIPIENTS: 500
    depends_on:
      core-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5070/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ==============================================================================
  # API GATEWAY & IAM SERVICE (PORT 4000)
  # Binds ONLY to localhost 127.0.0.1 (host Nginx proxies to it)
  # ==============================================================================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    networks:
      - portal-network
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@core-postgres:5432/${POSTGRES_DB:-ieee_core}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_TOKEN_GRACE_MS: ${REFRESH_TOKEN_GRACE_MS:-15000}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      AUTH_CLAIMS_HMAC_SECRET: ${AUTH_CLAIMS_HMAC_SECRET}
      IAM_SERVICE_AUTH_TOKEN: ${IAM_SERVICE_AUTH_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORE_PLATFORM_URL: http://core-platform:5070
      EVENT_REGISTER_URL: http://event-app:5050
      EMAIL_SERVICE_URL: http://email-api:3060
      FILE_SERVICE_URL: http://file-service:5080
    depends_on:
      core-platform:
        condition: service_healthy
      event-app:
        condition: service_healthy
      email-api:
        condition: service_healthy
      file-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ==============================================================================
  # EMAIL SERVICE - HTTP API PRODUCER (PORT 3060)
  # ==============================================================================
  email-api:
    build:
      context: ./services/email-service
      dockerfile: Dockerfile
    container_name: email-api
    restart: unless-stopped
    networks:
      - portal-network
    ports:
      - "127.0.0.1:3060:3060"
    environment:
      PORT: 3060
      EMAIL_SERVICE_PORT: 3060
      NODE_ENV: production
      LOG_LEVEL: info
      RUN_API: "true"
      RUN_CONSUMER: "true"
      EMAIL_BODY_LIMIT: ${EMAIL_BODY_LIMIT:-15mb}
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@portal-redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-}
      REDIS_STREAM_EMAIL: internal
      EMAIL_MAX_RETRIES: 5
      IDEMPOTENCY_ENABLED: "true"
    depends_on:
      portal-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3060/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  # ==============================================================================
  # EMAIL SERVICE - ASYNC STREAM CONSUMER WORKER
  # Activated with profile: --profile email-broker
  # ==============================================================================
  email-consumer:
    build:
      context: ./services/email-service
      dockerfile: Dockerfile
    container_name: email-consumer
    profiles: ["email-broker"]
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      PORT: 3060
      NODE_ENV: production
      RUN_API: "false"
      RUN_CONSUMER: "true"
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@portal-redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-}
    depends_on:
      portal-redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  # ==============================================================================
  # FILE SERVICE (PORT 5080)
  # ==============================================================================
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: portal-file-service
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      PORT: 5080
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@core-postgres:5432/${POSTGRES_DB:-ieee_core}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_ROOT_FOLDER: ieee_portal
      MAX_IMAGE_SIZE_MB: 10
      MAX_DOC_SIZE_MB: 15
      MAX_VIDEO_SIZE_MB: 25
      ENABLE_LOCAL_FALLBACK: "false"
    volumes:
      - file_uploads:/tmp/ieee_uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  # ==============================================================================
  # EVENT REGISTRATION SERVICE (PORT 5050)
  # ==============================================================================
  event-app:
    build:
      context: ./services/event-register
      dockerfile: Dockerfile
    container_name: event-register-app
    restart: unless-stopped
    networks:
      - portal-network
    environment:
      PORT: 5050
      NODE_ENV: production
      # MONGO_URI: mongodb://event-mongo:27017/ieee-registration
      REDIS_URL: redis://:${REDIS_PASSWORD}@portal-redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_STREAM_EMAIL: internal
      AUTH_CLAIMS_HMAC_SECRET: ${AUTH_CLAIMS_HMAC_SECRET}
      MAX_CLAIMS_LIFETIME_SECONDS: 1200
      CLAIMS_CLOCK_SKEW_SECONDS: 60
      EMAIL_SERVICE_URL: http://email-api:3060
      EMAIL_SERVICE_AUTH_TOKEN: ${EMAIL_SERVICE_AUTH_TOKEN}
    depends_on:
      event-mongo:
        condition: service_healthy
      portal-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5050/api/v1/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M

volumes:
  portal_redis_data:
  core_pg_data:
  event_mongo_data:
  file_uploads:
